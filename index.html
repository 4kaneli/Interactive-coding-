<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive coding</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #0dff00;
      --muted: #ffffff;
      --line: rgba(244,241,234,.18);
      --panel: rgba(255,255,255,.055);
      --cyan: #99ff00;
      --green: #00ff55;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; /* ❌ FIX IMPORTANTE */
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button { color: inherit; font: inherit; }
    .hidden { display: none !important; }

    .view { min-height: 100vh; }

    .view.splash {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 36%, rgba(255,255,255,.08), transparent 34%),
        linear-gradient(#090909, #020202);
    }

    .splash h1 {
      font-size: 120px;
    }

    #enterBtn {
      min-height: 44px;
      padding: 0 26px;
      border: 1px solid var(--fg);
      background: transparent;
      cursor: pointer;
    }

    .gallery {
      padding: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      height: 280px;
      background-size: cover;
      border: 1px solid var(--line);
      cursor: pointer;
    }

    .stage {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 18px;
    }

    #webcam {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 600px) {
      .splash h1 { font-size: 44px; }
      .grid { grid-template-columns: 1fr; }

      video {
        transform: scaleX(-1);
      }
    }
  </style>
</head>

<body>

<section id="view-splash" class="view splash">
  <div>
    <h1>INTERACTIVE<br>CODING</h1>
    <button id="enterBtn">ENTER</button>
  </div>
</section>

<section id="view-gallery" class="view gallery hidden">
  <div class="grid" id="projectGrid"></div>
</section>

<section id="view-project" class="view hidden">
  <video id="webcam" autoplay muted playsinline></video>
  <canvas id="output"></canvas>
</section>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
const video = document.getElementById("webcam");
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");

let cameraStarted = false;
let globalCamera;

function setSize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
setSize();
window.addEventListener("resize", setSize);

/* ================= CAMERA FIX ================= */
async function startGlobalCameraSystem() {
  try {
    startBtn.disabled = true;
    startBtn.textContent = "Starting...";

    // ❌ RIMOSSO: await video.play();

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    hands.setOptions({
      maxNumHands: 2,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });

    const faceMesh = new FaceMesh({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1
    });

    hands.onResults(r => globalHands = r.multiHandLandmarks || []);
    faceMesh.onResults(r => globalFace = r.multiFaceLandmarks?.[0] || null);

    globalCamera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
        await faceMesh.send({ image: video });
      },
      width: 1280,
      height: 720
    });

    await globalCamera.start();

    cameraStarted = true;
    startBtn.textContent = "Camera ON";

  } catch (e) {
    console.error(e);
    startBtn.disabled = false;
    startBtn.textContent = "Retry";
  }
}

/* UI */
document.getElementById("enterBtn").onclick = () => {
  document.getElementById("view-splash").classList.add("hidden");
  document.getElementById("view-gallery").classList.remove("hidden");
};

const startBtn = document.createElement("button");
startBtn.textContent = "Start camera";
startBtn.onclick = startGlobalCameraSystem;
document.body.appendChild(startBtn);

</script>

</body>
</html>
